<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sana Özel</title>

<style>
body {
  background: black;
  color: pink;
  text-align: center;
  font-family: Arial, sans-serif;
  margin-top: 80px;
}
.heart {
  font-size: 70px;
  animation: beat 1s infinite;
}
@keyframes beat {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}
button {
  background: pink;
  border: none;
  padding: 12px 20px;
  font-size: 16px;
  cursor: pointer;
  border-radius: 20px;
}
</style>
</head>

<body>

<h1>Özlem ❤️ Enes</h1>
<div class="heart">❤️</div>

<p>
Sen hayatıma girdiğinden beri her şey daha gerçek.
</p>

<br>

<button onclick="playMusic()">🎵 Müzik Başlasın</button>

<audio id="bgm" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
function playMusic() {
  document.getElementById("bgm").play();
}
</script>

</body>
</html>
