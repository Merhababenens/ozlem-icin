<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sana Özel</title>
<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: #4fdcff;
}
canvas {
  position: fixed;
  inset: 0;
}
.title {
  position: absolute;
  top: 20%;
  width: 100%;
  text-align: center;
  font-size: 42px;
  font-weight: bold;
  text-shadow: 0 0 30px #4fdcff;
  z-index: 2;
}
button {
  position: absolute;
  bottom: 10%;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 28px;
  border-radius: 30px;
  border: none;
  background: #4fdcff;
  color: black;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 20px #4fdcff;
  z-index: 2;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div class="title">balım</div>
<button onclick="play()">🎧 Müziği Aç</button>

<audio id="music" src="music.mp3" loop></audio>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
resize();
window.onresize = resize;

function resize(){
  c.width = innerWidth;
  c.height = innerHeight;
}

function heart(t){
  return {
    x: 16*Math.pow(Math.sin(t),3),
    y: -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
  };
}

let pts=[];
for(let i=0;i<1200;i++){
  let t=Math.random()*Math.PI*2;
  let p=heart(t);
  pts.push({t, ox:p.x, oy:p.y});
}

let pulse=0;
function draw(){
  pulse+=0.04;
  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,c.width,c.height);

  // ALT IŞIK HALKASI
  let gx=ctx.createRadialGradient(c.width/2,c.height/2+120,10,c.width/2,c.height/2+120,180);
  gx.addColorStop(0,"rgba(79,220,255,0.6)");
  gx.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=gx;
  ctx.beginPath();
  ctx.arc(c.width/2,c.height/2+120,180,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#4fdcff";
  pts.forEach(p=>{
    let s=22+Math.sin(pulse)*2;
    ctx.beginPath();
    ctx.arc(
      c.width/2+p.ox*s,
      c.height/2+p.oy*s,
      1.2,
      0,Math.PI*2
    );
    ctx.fill();
  });

  requestAnimationFrame(draw);
}
draw();

function play(){
  document.getElementById("music").play();
}
</script>
</body>
</html>
