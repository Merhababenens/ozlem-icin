<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sana Özel</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

/* Canvas */
canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,.2);
  z-index: 1;
}

/* ÜSTTEKİ YAZI */
.title {
  position: absolute;
  top: 15%;
  width: 100%;
  text-align: center;
  font-size: 48px;
  font-weight: bold;
  color: #00ddff;
  text-shadow: 0 0 25px #00ddff;
  z-index: 5; /* canvas'ın ÜSTÜNDE */
  pointer-events: none;
}
</style>
</head>

<body>

<!-- YAZI -->
<div class="title">Balım ❤️</div>

<!-- CANVAS -->
<canvas id="heart"></canvas>

<script>
/* === CODEPEN JS'İ (DOKUNMADIM) === */

var canvas = document.getElementById("heart"),
    ctx = canvas.getContext("2d"),
    w, h;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

var config = {
  traceK: 0.4,
  timeDelta: 0.01
};

var heartPoints = [], targetPoints = [], particles = [];

function heart(t) {
  return [
    16 * Math.pow(Math.sin(t), 3),
    13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)
  ];
}

for (var i = 0; i < Math.PI * 2; i += 0.02) {
  var p = heart(i);
  targetPoints.push([p[0], -p[1]]);
}

function init() {
  for (var i = 0; i < targetPoints.length; i++) {
    particles.push({
      x: w / 2,
      y: h / 2,
      vx: 0,
      vy: 0,
      trace: new Array(20).fill({x: w/2, y: h/2}),
      f: "#00ddff"
    });
  }
  loop();
}

function loop() {
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(0, 0, w, h);
